name: Update dashboard

on:
  schedule:
    # 6:30pm Eastern on weekdays (22:30 UTC), after the market close.
    - cron: "30 22 * * 1-5"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["dashboard.py", "template.html", "peers.json"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build dashboard from SEC data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python dashboard.py

      - name: Commit the updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update dashboard data"
            git push
          fi
